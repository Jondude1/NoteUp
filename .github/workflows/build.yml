name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk NoteUp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NoteUp-apk
          path: NoteUp.apk

      # Always-current download link: Releases → "latest" → NoteUp.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NoteUp.apk \
            --title "NoteUp build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Open this page on your tablet and tap NoteUp.apk to install." \
            --latest
